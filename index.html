<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fame Seminuevos - Catálogo Oficial</title>
    
    <!-- FUENTES ÉLITE -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-fondo: #090E17;
            --color-texto: #F8FAFC;
            --color-texto-mute: #94A3B8;
            --color-primario: #3B82F6;
            --color-exito: #10B981;
            --color-acento: #F43F5E;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: 1px solid rgba(255, 255, 255, 0.08);
            --glass-blur: blur(20px);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--color-fondo);
            background-image: radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.1), transparent 30%);
            background-attachment: fixed;
            color: var(--color-texto);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            padding: 30px 10px;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            color: #ffffff;
        }

        header p {
            color: var(--color-texto-mute);
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
        }

        /* FILTROS CHIPS */
        .contenedor-filtros {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 15px 0;
            justify-content: center;
            margin-bottom: 25px;
        }
        .contenedor-filtros::-webkit-scrollbar { display: none; }
        
        .chip-filtro {
            background: var(--glass-bg);
            border: var(--glass-border);
            color: var(--color-texto-mute);
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: var(--glass-blur);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .chip-filtro.activo, .chip-filtro:hover {
            background: rgba(59, 130, 246, 0.2);
            color: #ffffff;
            border-color: var(--color-primario);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        /* GRID DE AUTOS */
        .grid-autos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .tarjeta-auto {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: var(--glass-border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s;
        }
        .tarjeta-auto:hover { transform: translateY(-5px); border-color: rgba(255,255,255,0.2); }

        .contenedor-imagen {
            position: relative;
            width: 100%;
            height: 200px;
            background: #111;
        }
        .contenedor-imagen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-estatus {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            backdrop-filter: blur(10px);
        }
        .estatus-disponible { background: rgba(16, 185, 129, 0.85); color: white; }
        .estatus-toma { background: rgba(245, 158, 11, 0.85); color: white; }
        .estatus-apartado { background: rgba(234, 88, 12, 0.85); color: white; }
        .estatus-vendido { background: rgba(239, 68, 68, 0.85); color: white; }

        .info-auto {
            padding: 22px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .info-auto h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.35rem;
            margin: 0 0 8px 0;
            color: #ffffff;
        }

        .detalles-tecnicos {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
            color: var(--color-texto-mute);
            margin-bottom: 15px;
            font-weight: 500;
        }

        .especificaciones-unicas {
            font-size: 0.85rem;
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-style: italic;
        }

        .seccion-precio {
            margin-top: auto;
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 15px;
        }
        .precio-actual {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--color-exito);
        }
        .precio-anterior {
            font-size: 1rem;
            color: var(--color-texto-mute);
            text-decoration: line-through;
        }

        .btn-whatsapp {
            background: linear-gradient(135deg, var(--color-exito) 0%, #059669 100%);
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
            transition: all 0.3s;
        }
        .btn-whatsapp:hover { opacity: 0.9; transform: scale(1.02); }

        .sin-resultados {
            text-align: center;
            grid-column: 1 / -1;
            padding: 50px;
            color: var(--color-texto-mute);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Fame Seminuevos</h1>
        <p>Catálogo Digital Autorizado</p>
    </header>

    <main>
        <div class="contenedor-filtros">
            <button class="chip-filtro activo" onclick="filtrarCategoria('todos', this)">✨ Todos</button>
            <button class="chip-filtro" onclick="filtrarCategoria('sedan', this)">🚗 Sedán</button>
            <button class="chip-filtro" onclick="filtrarCategoria('suv', this)">🚙 SUV</button>
            <button class="chip-filtro" onclick="filtrarCategoria('crossover', this)">🌆 Crossover</button>
            <button class="chip-filtro" onclick="filtrarCategoria('hatchback', this)">🚘 Hatchback</button>
            <button class="chip-filtro" onclick="filtrarCategoria('pickup', this)">🛻 Pick-ups</button>
        </div>

        <div id="grid-catalogo" class="grid-autos">
            <p class="sin-resultados">Cargando inventario en tiempo real...</p>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDMD5V1nEg_SmV7VdlZ1--HJfc3_zeb7sg",
            authDomain: "agenda-inteligente-b43d9.firebaseapp.com",
            projectId: "agenda-inteligente-b43d9",
            storageBucket: "agenda-inteligente-b43d9.firebasestorage.app",
            messagingSenderId: "76660144842",
            appId: "1:76660144842:web:cdc3b2a5122ea448f39233"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let listaAutos = [];
        let categoriaActual = 'todos';

        function normalizar(texto) {
            return (texto || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        window.filtrarCategoria = function(cat, elemento) {
            categoriaActual = cat;
            document.querySelectorAll('.chip-filtro').forEach(b => b.classList.remove('activo'));
            elemento.classList.add('activo');
            renderizarCatalogo();
        }

        function renderizarCatalogo() {
            const grid = document.getElementById('grid-catalogo');
            grid.innerHTML = '';

            let filtrados = listaAutos;
            if (categoriaActual !== 'todos') {
                filtrados = listaAutos.filter(a => normalizar(a.categoria).includes(normalizar(categoriaActual)));
            }

            if (filtrados.length === 0) {
                grid.innerHTML = '<p class="sin-resultados">No hay unidades disponibles en esta categoría por el momento.</p>';
                return;
            }

            // Capturar parámetro ?origen= de la URL (para los códigos QR)
            const urlParams = new URLSearchParams(window.location.search);
            const origenQR = urlParams.get('origen') || 'Directo_Web';

            filtrados.forEach(auto => {
                // Traducción y clases de estatus
                let estatusTexto = 'Disponible';
                let claseEstatus = 'estatus-disponible';
                if(auto.estatus === 'toma') { estatusTexto = 'En Proceso de Toma'; claseEstatus = 'estatus-toma'; }
                if(auto.estatus === 'apartado') { estatusTexto = 'Apartado'; claseEstatus = 'estatus-apartado'; }
                if(auto.estatus === 'vendido') { estatusTexto = 'Vendido'; claseEstatus = 'estatus-vendido'; }

                // Mensaje de WhatsApp personalizado con el origen del QR
                const textoWa = encodeURIComponent(`¡Hola! Me interesa el ${auto.modelo} (${auto.anio}) publicado en su catálogo (Origen: ${origenQR}). ¿Me da más detalles?`);
                const enlaceWa = `https://wa.me/524521382405?text=${textoWa}`;

                // Manejo de oferta
                let seccionPrecio = `<div class="precio-actual">$${Number(auto.precio).toLocaleString('es-MX')}</div>`;
                if(auto.aplicaOferta && auto.precioOferta) {
                    seccionPrecio = `
                        <div class="precio-actual" style="color: var(--color-acento);">$${Number(auto.precioOferta).toLocaleString('es-MX')}</div>
                        <div class="precio-anterior">$${Number(auto.precio).toLocaleString('es-MX')}</div>
                    `;
                }

                grid.innerHTML += `
                    <article class="tarjeta-auto">
                        <div class="contenedor-imagen">
                            <span class="badge-estatus ${claseEstatus}">${estatusTexto}</span>
                            <img src="${auto.fotoUrl || 'https://via.placeholder.com/400x300?text=Fame+Seminuevos'}" alt="${auto.modelo}">
                        </div>
                        <div class="info-auto">
                            <h3>${auto.modelo}</h3>
                            <div class="detalles-tecnicos">
                                <span>📅 ${auto.anio}</span>
                                <span>🛣️ ${Number(auto.kilometraje).toLocaleString('es-MX')} km</span>
                            </div>
                            ${auto.especificaciones ? `<div class="especificaciones-unicas">"${auto.especificaciones}"</div>` : ''}
                            <div class="seccion-precio">
                                ${seccionPrecio}
                            </div>
                            <a href="${enlaceWa}" target="_blank" class="btn-whatsapp">📲 Me Interesa / Apartar</a>
                        </div>
                    </article>
                `;
            });
        }

        // Sincronización en tiempo real con Firestore collection "autos"
        onSnapshot(collection(db, "autos"), (snapshot) => {
            listaAutos = [];
            snapshot.forEach((doc) => {
                listaAutos.push({ id: doc.id, ...doc.data() });
            });
            renderizarCatalogo();
        });
    </script>
</body>
</html>
